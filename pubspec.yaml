name: krocpdf
description: "All-in-one file converter and PDF toolkit."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: 3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 14.8.1
  cunning_document_scanner: 3.0.4
  image: 4.10.0
  image_cropper: 12.2.1
  pdf: 3.13.1
  path_provider: 2.1.6
  share_plus: ^13.3.1
  printing: ^5.15.1
  syncfusion_flutter_pdf: ^35.1.42
  pdfrx: ^2.4.8
  flutter_image_compress: ^2.5.1
  permission_handler: 13.0.2
  image_picker: ^1.2.4
  file_picker: ^13.3.1
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_native_splash: 2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
