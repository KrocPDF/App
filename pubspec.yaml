publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: 3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_native_splash: 2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
