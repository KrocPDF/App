name: Label Manager & Auto Tagger

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  sync-labels:
    name: Sync Repository Labels
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update repository labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existingMap = new Map(existing.map(l => [l.name.toLowerCase(), l]));

            for (const label of labels) {
              const current = existingMap.get(label.name.toLowerCase());
              if (!current) {
                console.log(`Creating label: ${label.name}`);
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description || '',
                });
              } else if (current.color.toLowerCase() !== label.color.toLowerCase() || current.description !== (label.description || '')) {
                console.log(`Updating label: ${label.name}`);
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: current.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description || '',
                });
              }
            }

  label-pull-request:
    name: Auto-Label Pull Request
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    steps:
      - name: Apply Path-Based Labels
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

      - name: Apply Metadata & Semantic PR Labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            const labelsToAdd = new Set();
            const title = (pr.title || '').trim();
            const body = (pr.body || '').toLowerCase();

            // 1. Semantic Conventional Commit prefix matching on PR title
            const conventionalMatches = {
              '^fix(\\(.*\\))?!?:': 'type: bug',
              '^feat(\\(.*\\))?!?:': 'type: feature',
              '^docs(\\(.*\\))?!?:': 'type: documentation',
              '^style(\\(.*\\))?!?:': 'type: refactor',
              '^refactor(\\(.*\\))?!?:': 'type: refactor',
              '^perf(\\(.*\\))?!?:': 'type: performance',
              '^test(\\(.*\\))?!?:': 'type: test',
              '^ci(\\(.*\\))?!?:': 'type: ci/cd',
              '^chore(\\(.*\\))?!?:': 'type: refactor',
              '^security(\\(.*\\))?!?:': 'type: security',
            };

            for (const [regex, label] of Object.entries(conventionalMatches)) {
              if (new RegExp(regex, 'i').test(title)) {
                labelsToAdd.add(label);
              }
            }

            // 2. Semver label inference from title / breaking changes
            if (title.includes('!') || /breaking change/i.test(body)) {
              labelsToAdd.add('semver: breaking');
            } else if (/^feat/i.test(title)) {
              labelsToAdd.add('semver: minor');
            } else if (/^fix/i.test(title)) {
              labelsToAdd.add('semver: patch');
            }

            // 3. PR Diff Size Classification
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const totalLines = additions + deletions;

            // Remove previous size labels if re-evaluating
            const sizeLabels = ['size: xs', 'size: s', 'size: m', 'size: l', 'size: xl'];
            const currentLabels = (pr.labels || []).map(l => l.name);

            let newSizeLabel = 'size: m';
            if (totalLines <= 20) newSizeLabel = 'size: xs';
            else if (totalLines <= 100) newSizeLabel = 'size: s';
            else if (totalLines <= 300) newSizeLabel = 'size: m';
            else if (totalLines <= 800) newSizeLabel = 'size: l';
            else newSizeLabel = 'size: xl';

            labelsToAdd.add(newSizeLabel);

            // 4. Checkbox inspection from PR template
            if (body.includes('[x] 🚀 new feature') || body.includes('[x] new feature')) {
              labelsToAdd.add('type: feature');
            }
            if (body.includes('[x] 🐛 bug fix') || body.includes('[x] bug fix')) {
              labelsToAdd.add('type: bug');
            }
            if (body.includes('[x] ⚡ performance')) {
              labelsToAdd.add('type: performance');
            }
            if (body.includes('[x] 🛠 ci/cd')) {
              labelsToAdd.add('type: ci/cd');
            }
            if (body.includes('[x] 📚 documentation')) {
              labelsToAdd.add('type: documentation');
            }

            // Filter out existing labels to avoid unnecessary API noise
            const finalLabels = Array.from(labelsToAdd).filter(l => !currentLabels.includes(l));

            if (finalLabels.length > 0) {
              console.log(`Adding labels to PR #${pr.number}:`, finalLabels);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: finalLabels,
              });
            }

  label-issue:
    name: Auto-Label Issue
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Classify & Label Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;

            const labelsToAdd = new Set();
            const title = (issue.title || '').toLowerCase();
            const body = (issue.body || '').toLowerCase();

            // 1. Issue title prefixes
            if (title.startsWith('[bug]') || title.includes('bug') || title.includes('crash') || title.includes('error')) {
              labelsToAdd.add('type: bug');
            }
            if (title.startsWith('[feature]') || title.includes('feature request') || title.includes('proposal')) {
              labelsToAdd.add('type: feature');
            }
            if (title.startsWith('[docs]') || title.includes('documentation')) {
              labelsToAdd.add('type: documentation');
            }

            // 2. Issue Form selection parsing (Platforms)
            if (body.includes('android (physical device)') || body.includes('android (emulator)') || body.includes('android')) {
              labelsToAdd.add('platform: android');
            }
            if (body.includes('ios (physical device)') || body.includes('ios (simulator)') || body.includes('ios')) {
              labelsToAdd.add('platform: ios');
            }
            if (body.includes('web preview') || body.includes('web')) {
              labelsToAdd.add('platform: web');
            }

            // 3. Execution mode detection
            if (body.includes('confidential mode')) {
              labelsToAdd.add('mode: confidential');
            } else if (body.includes('non-confidential mode')) {
              labelsToAdd.add('mode: cloud');
            }

            // 4. Scope detection based on content
            if (body.includes('scanner') || body.includes('camera') || body.includes('ml kit') || title.includes('scan')) {
              labelsToAdd.add('scope: scanner');
            }
            if (body.includes('compress') || body.includes('merge') || body.includes('split') || title.includes('pdf')) {
              labelsToAdd.add('scope: pdf-tools');
            }
            if (body.includes('image') || body.includes('convert') || body.includes('crop') || body.includes('heic')) {
              labelsToAdd.add('scope: image-tools');
            }
            if (body.includes('saved files') || body.includes('storage') || body.includes('permission') || body.includes('file manager')) {
              labelsToAdd.add('scope: file-manager');
            }
            if (body.includes('animation') || body.includes('theme') || body.includes('splash') || body.includes('ui')) {
              labelsToAdd.add('scope: ui/ux');
            }

            // Always add needs-triage for new issues if not already present
            const currentLabels = (issue.labels || []).map(l => l.name);
            labelsToAdd.add('status: needs-review');

            const finalLabels = Array.from(labelsToAdd).filter(l => !currentLabels.includes(l));
            if (finalLabels.length > 0) {
              console.log(`Adding labels to Issue #${issue.number}:`, finalLabels);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: finalLabels,
              });
            }

