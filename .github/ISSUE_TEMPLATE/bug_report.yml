name: Bug Report
description: File a bug or unexpected behavior in the KrocPDF Mobile app.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us diagnose and resolve the bug quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Open KrocPDF App
        2. Tap on 'Convert Image'
        3. Select HEIC image > 10MB
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating Platform
      options:
        - Android (Physical Device)
        - Android (Emulator)
        - iOS (Physical Device)
        - iOS (Simulator)
        - Web Preview
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS Version & Device Model
      placeholder: "e.g., Pixel 7, Android 14 / iPhone 15, iOS 17.4"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Paste any error messages or flutter logs here.
      render: shell
