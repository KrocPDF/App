# ==============================================================================
# KrocPDF App - PR & Branch Labeling Rules
# ==============================================================================

# --- Platforms ---
"platform: android":
  - changed-files:
      - any-glob-to-any-file:
          - 'android/**'

"platform: ios":
  - changed-files:
      - any-glob-to-any-file:
          - 'ios/**'

"platform: web":
  - changed-files:
      - any-glob-to-any-file:
          - 'web/**'

# --- Scopes ---
"scope: pdf-tools":
  - changed-files:
      - any-glob-to-any-file:
          - 'lib/services/pdf_*.dart'
          - 'test/unit/pdf_*.dart'

"scope: scanner":
  - changed-files:
      - any-glob-to-any-file:
          - 'lib/features/tool_flow/domain/scanned_document.dart'
          - 'lib/features/tool_flow/presentation/document_editor_screen.dart'
          - 'test/unit/scanned_document_test.dart'

"scope: image-tools":
  - changed-files:
      - any-glob-to-any-file:
          - 'lib/services/image_*.dart'
          - 'test/unit/image_*.dart'

"scope: file-manager":
  - changed-files:
      - any-glob-to-any-file:
          - 'lib/features/files/**'
          - 'test/files_*.dart'

"scope: ui/ux":
  - changed-files:
      - any-glob-to-any-file:
          - 'lib/core/theme/**'
          - 'lib/features/launch/**'
          - 'assets/**'
          - 'flutter_native_splash.yaml'
          - 'test/launch_animation_test.dart'

"scope: navigation":
  - changed-files:
      - any-glob-to-any-file:
          - 'lib/app.dart'

"scope: core":
  - changed-files:
      - any-glob-to-any-file:
          - 'lib/core/**'

"scope: architecture":
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '.planning/**'

# --- Types ---
"type: ci/cd":
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

"type: test":
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**'

"type: documentation":
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'LICENSE'
          - 'CHANGELOG.md'
